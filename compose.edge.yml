name: csp-edge

services:
  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "0.0.0.0:443:443"
    volumes:
      - "${CSP_TLS_DIR:-./runtime/tls}:/etc/nginx/tls:ro"
      - "./deploy/nginx-srv-ai.conf:/etc/nginx/conf.d/default.conf:ro"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=4m
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    networks: [csp_frontend]

networks:
  csp_frontend:
    external: true
    name: csp_frontend
