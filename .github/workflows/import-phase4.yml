name: Import Phase 4 source

on:
  push:
    branches:
      - agent/v0.2.0-alpha
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  import-source:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[phase4-import]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.2.0-alpha
          fetch-depth: 0

      - name: Expand reviewed Phase 4 archive
        shell: bash
        run: |
          set -euo pipefail
          test -f customer-service-platform-phase4.zip
          tmp="$(mktemp -d)"
          unzip -q customer-service-platform-phase4.zip -d "$tmp"
          test -f "$tmp/csp/README.md"
          test -f "$tmp/csp/apps/api/pyproject.toml"
          test -f "$tmp/csp/docker-compose.yml"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/import-phase4.yml' \
            "$tmp/csp/" ./
          rm -f customer-service-platform-phase4.zip customer-service-platform.bundle files.zip

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source is already imported"
            exit 0
          fi
          git diff --cached --check
          git commit -m "feat: publish support endpoint v0.2.0-alpha [phase4-import]"
          git push origin HEAD:agent/v0.2.0-alpha
