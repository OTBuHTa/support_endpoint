name: CSP CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: csp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-test:
    name: Python 3.12 / lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check app tests
      - name: Tests
        run: pytest -q
      - name: Whitespace
        working-directory: .
        run: git diff --check

  migration-check:
    name: Alembic upgrade/downgrade
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Migrate up/down
        env:
          DATABASE_URL: sqlite:///./ci_migration_check.db
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base

  web-build:
    name: React / typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  production-manifest:
    name: Production compose manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate production compose
        env:
          POSTGRES_PASSWORD: replace-with-a-long-random-password
          CSP_ENV_FILE: .env.production.example
        run: docker compose -f compose.production.yml config --quiet
      - name: Validate operations and release scripts
        run: bash -n tools/backup.sh tools/restore-verify.sh tools/release-check.sh tools/smoke-production.sh tools/deploy-production.sh
      - name: Release consistency
        env:
          RELEASE_VERSION: 0.9.0-rc1
        run: bash tools/release-check.sh

  backup-restore:
    name: PostgreSQL backup / restore rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_PASSWORD: replace-with-a-long-random-password
      CSP_ENV_FILE: .env.production.example
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Start PostgreSQL
        run: docker compose -f compose.production.yml up -d --wait postgres
      - name: Seed schema marker
        run: |
          docker compose -f compose.production.yml exec -T postgres \
            sh -ceu 'psql --username="$POSTGRES_USER" --dbname="$POSTGRES_DB" --command="CREATE TABLE alembic_version (version_num integer PRIMARY KEY); INSERT INTO alembic_version VALUES (1);"'
      - name: Backup and restore verify
        run: |
          bash tools/backup.sh
          backup_file="$(find backups -name '*.dump' -type f | sort | tail -1)"
          bash tools/restore-verify.sh "$backup_file"
      - name: Cleanup
        if: always()
        run: docker compose -f compose.production.yml down -v

  release-smoke:
    name: RC1 hardened production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: replace-with-a-long-random-password
      CSP_ENV_FILE: .env.production.example
      CSP_WEB_BIND: 127.0.0.1:18180
      CSP_SMOKE_BASE_URL: http://127.0.0.1:18180
      CSP_EXPECT_BUILD_REVISION: ${{ github.sha }}
      RELEASE_VERSION: 0.9.0-rc1
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Release consistency
        run: bash tools/release-check.sh
      - name: Start hardened production stack
        env:
          CSP_BUILD_REVISION: ${{ github.sha }}
        run: docker compose -f compose.production.yml up -d --build postgres redis migration api sla-scheduler web
      - name: Smoke production edge
        run: bash tools/smoke-production.sh
      - name: Capture stack state on failure
        if: failure()
        run: |
          docker compose -f compose.production.yml ps -a
          docker compose -f compose.production.yml logs --no-color --tail=200 migration api sla-scheduler web postgres redis
      - name: Cleanup
        if: always()
        run: docker compose -f compose.production.yml down -v
