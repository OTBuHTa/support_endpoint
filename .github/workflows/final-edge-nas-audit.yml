name: Final edge and NAS audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    if: ${{ github.head_ref == 'agent/final-edge-nas' }}
    name: Audit srv-ai HTTPS and NAS
    runs-on: [self-hosted, linux, x64, support-production]
    timeout-minutes: 10
    steps:
      - name: Read-only host audit
        shell: bash
        working-directory: /opt/support-endpoint
        run: |
          set -euo pipefail
          echo '=== HOST ==='
          hostname
          hostname -f || true
          getent hosts srv-ai || true
          echo '=== LISTENERS ==='
          ss -lntp 2>/dev/null | grep -E ':(80|443|8180|8443)[[:space:]]' || true
          echo '=== TLS TOOLS ==='
          command -v openssl || true
          command -v step || true
          command -v mkcert || true
          command -v nginx || true
          command -v caddy || true
          echo '=== HOST SERVICES ==='
          systemctl list-unit-files --type=service 2>/dev/null | grep -Ei 'nginx|caddy|apache|cloudflared' || true
          echo '=== MOUNTS ==='
          findmnt -t nfs,nfs4,cifs,smb3 2>/dev/null || true
          echo '=== FSTAB REMOTE ENTRIES ==='
          grep -Ev '^[[:space:]]*(#|$)' /etc/fstab 2>/dev/null | grep -Ei 'nfs|cifs|smb|://' || true
          echo '=== COMMON NAS PATHS ==='
          for p in /mnt /media /srv /backup /backups; do
            [ -d "$p" ] && find "$p" -maxdepth 2 -mindepth 1 -type d -printf '%p\n' 2>/dev/null | head -80 || true
          done
          echo '=== HOSTS / NAS NAMES ==='
          grep -Ei 'nas|synology|qnap' /etc/hosts 2>/dev/null || true
          getent hosts nas NAS synology qnap 2>/dev/null || true
          echo '=== SSH KNOWN HOST LABELS (no keys) ==='
          if [ -r "$HOME/.ssh/known_hosts" ]; then
            cut -d' ' -f1 "$HOME/.ssh/known_hosts" | grep -Ev '^\|' | head -50 || true
          fi
          echo '=== SUPPORT ENV NON-SECRETS ==='
          sed -n -E '/^(CSP_WEB_BIND|CORS_ALLOW_ORIGINS)=/p' .env.production || true
          echo '=== LOCAL CSP HEALTH ==='
          curl -fsS http://127.0.0.1:8180/health || true
          echo
