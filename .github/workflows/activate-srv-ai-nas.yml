name: Activate srv-ai HTTPS and NAS

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  activate:
    if: ${{ github.head_ref == 'agent/activate-srv-ai-nas' }}
    name: Activate HTTPS and NAS on srv-ai
    runs-on: [self-hosted, linux, x64, support-production]
    timeout-minutes: 30
    steps:
      - name: Activate and verify
        shell: bash
        working-directory: /opt/support-endpoint
        env:
          CSP_ENV_FILE: .env.production
          CSP_TLS_DIR: ./runtime/tls
          CSP_TLS_HOSTNAME: srv-ai
          CSP_PUBLIC_ORIGIN: https://srv-ai
          CSP_PUBLIC_CA_FILE: ./runtime/tls/ca.crt
          CSP_NAS_HOST: 192.168.5.160
          CSP_NAS_EXPORT: /Volume1/AI-Lab-Backup
          CSP_NAS_RETENTION_DAYS: '30'
          RELEASE_VERSION: 0.9.0
        run: |
          set -euo pipefail
          [[ "$(hostname -s)" == "srv-ai" ]]
          test -d .git
          test -f .env.production
          [[ "$(stat -c '%a' .env.production)" == "600" ]]
          git diff --quiet
          git diff --cached --quiet
          git fetch --prune origin main
          git checkout main
          git reset --hard origin/main

          if ss -lnt 2>/dev/null | grep -qE '[:.]443[[:space:]]'; then
            if ! docker ps --format '{{.Names}}' | grep -qx 'csp-edge-edge-1'; then
              echo 'port 443 is already occupied by another service' >&2
              exit 1
            fi
          fi

          cp -p .env.production .env.production.pre-srv-ai
          chmod 600 .env.production.pre-srv-ai
          if grep -q '^CORS_ALLOW_ORIGINS=' .env.production; then
            sed -i 's#^CORS_ALLOW_ORIGINS=.*#CORS_ALLOW_ORIGINS=https://srv-ai#' .env.production
          else
            printf '\nCORS_ALLOW_ORIGINS=https://srv-ai\n' >> .env.production
          fi
          chmod 600 .env.production

          bash tools/generate-local-tls.sh
          docker compose -f compose.edge.yml up -d --remove-orphans
          CSP_EXPECT_BUILD_REVISION="$(git rev-parse HEAD)" bash tools/production-edge-check.sh

          export CSP_NAS_MOUNT_POINT=/mnt/support-endpoint-nas
          export CSP_NAS_BACKUP_DIR=/mnt/support-endpoint-nas/support-endpoint
          if ! bash tools/ensure-nas-mount.sh; then
            echo 'dedicated NFS mount unavailable; checking existing verified host automount'
            timeout 10 ls /mnt/ai-lab-nas >/dev/null
            findmnt -rn -T /mnt/ai-lab-nas -t nfs,nfs4 >/dev/null
            export CSP_NAS_MOUNT_POINT=/mnt/ai-lab-nas
            export CSP_NAS_BACKUP_DIR=/mnt/ai-lab-nas/support-endpoint
          fi

          bash tools/backup-to-nas.sh

          echo '=== FINAL EDGE ==='
          curl --cacert ./runtime/tls/ca.crt -fsS https://srv-ai/health
          echo
          echo '=== NAS TARGET ==='
          echo "$CSP_NAS_BACKUP_DIR"
          echo '=== NAS LATEST ==='
          find "$CSP_NAS_BACKUP_DIR" -maxdepth 1 -type f -name 'csp-*.dump' -printf '%TY-%Tm-%TdT%TH:%TM:%TS %s %p\n' | sort | tail -3
