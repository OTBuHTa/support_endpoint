name: Apply final srv-ai edge and NAS

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  apply:
    if: ${{ github.head_ref == 'agent/apply-final-edge-nas' }}
    name: Apply srv-ai HTTPS and NAS backup
    runs-on: [self-hosted, linux, x64, support-production]
    timeout-minutes: 45
    steps:
      - name: Verify target host
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(hostname -s)" == "srv-ai" ]]
          docker info >/dev/null
          test -d /opt/support-endpoint/.git
          test -f /opt/support-endpoint/.env.production
          [[ "$(stat -c '%a' /opt/support-endpoint/.env.production)" == "600" ]]
          if ss -lnt 2>/dev/null | grep -E ':443[[:space:]]' >/dev/null; then
            docker ps --format '{{.Names}} {{.Ports}}' | grep -q '^csp-edge-edge-1 .*443' || {
              echo 'port 443 is already occupied by another service' >&2
              exit 1
            }
          fi

      - name: Sync approved main
        shell: bash
        working-directory: /opt/support-endpoint
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git fetch --prune origin main
          git checkout main
          git reset --hard origin/main
          echo "revision=$(git rev-parse HEAD)"

      - name: Configure srv-ai TLS and CORS
        shell: bash
        working-directory: /opt/support-endpoint
        run: |
          set -euo pipefail
          sed -i 's#^CORS_ALLOW_ORIGINS=.*#CORS_ALLOW_ORIGINS=https://srv-ai#' .env.production
          grep -q '^CORS_ALLOW_ORIGINS=https://srv-ai$' .env.production
          [[ "$(stat -c '%a' .env.production)" == "600" ]]
          CSP_TLS_HOSTNAME=srv-ai bash tools/generate-local-tls.sh
          docker compose -f compose.edge.yml up -d edge

      - name: Deploy stable runtime with final origin
        shell: bash
        working-directory: /opt/support-endpoint
        env:
          CSP_ENV_FILE: .env.production
          RELEASE_VERSION: 0.9.0
          CSP_SMOKE_BASE_URL: http://127.0.0.1:8180
        run: bash tools/deploy-production.sh

      - name: Create verified NAS backup
        shell: bash
        working-directory: /opt/support-endpoint
        env:
          CSP_ENV_FILE: .env.production
          CSP_NAS_BACKUP_DIR: /mnt/ai-lab-nas/support-endpoint
          CSP_NAS_RETENTION_DAYS: '30'
        run: bash tools/backup-to-nas.sh

      - name: Verify HTTPS edge
        shell: bash
        working-directory: /opt/support-endpoint
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          CSP_ENV_FILE=.env.production \
          CSP_PUBLIC_ORIGIN=https://srv-ai \
          CSP_PUBLIC_CA_FILE=runtime/tls/ca.crt \
          RELEASE_VERSION=0.9.0 \
          CSP_EXPECT_BUILD_REVISION="$revision" \
          bash tools/production-edge-check.sh
          docker compose -f compose.edge.yml ps
          openssl x509 -in runtime/tls/server.crt -noout -subject -issuer -dates -ext subjectAltName
