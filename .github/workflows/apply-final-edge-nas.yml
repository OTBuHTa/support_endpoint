name: Apply final srv-ai edge and NAS

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  apply:
    if: ${{ github.head_ref == 'agent/apply-final-edge-nas' }}
    name: Inspect NAS admin channel
    runs-on: [self-hosted, linux, x64, support-production]
    timeout-minutes: 10
    steps:
      - name: Verify HTTPS production edge
        shell: bash
        working-directory: /opt/support-endpoint
        run: |
          set -euo pipefail
          git fetch --prune origin main
          git checkout main
          git reset --hard origin/main
          tls_dir="$HOME/support-endpoint-runtime/tls"
          CSP_TLS_DIR="$tls_dir" docker compose -f compose.edge.yml up -d edge
          curl --cacert "$tls_dir/ca.crt" -fsS --max-time 10 https://srv-ai/health
          echo

      - name: Inspect NAS management reachability
        shell: bash
        run: |
          set -euo pipefail
          nas=192.168.5.160
          echo '=== NAS EXPORT ACL ==='
          docker run --rm --network=host alpine:3.20 sh -ceu '
            apk add --no-cache nfs-utils >/dev/null
            showmount -e 192.168.5.160 || true
          '
          echo '=== MANAGEMENT PORTS ==='
          for port in 22 80 443 5000 5001 8080 8443; do
            if timeout 2 bash -c "</dev/tcp/$nas/$port" 2>/dev/null; then
              echo "OPEN $port"
            else
              echo "CLOSED $port"
            fi
          done
          echo '=== HTTP HEADERS ==='
          for url in http://$nas https://$nas http://$nas:5000 https://$nas:5001 http://$nas:8080 https://$nas:8443; do
            echo "--- $url"
            curl -kIsS --max-time 3 "$url" 2>/dev/null | sed -n '1,12p' || true
          done
          echo '=== SSH HOST KEY ==='
          if command -v ssh-keyscan >/dev/null; then
            timeout 5 ssh-keyscan -T 3 "$nas" 2>/dev/null | head -5 || true
          fi
          echo '=== EXISTING NONINTERACTIVE SSH TEST ==='
          timeout 6 ssh -o BatchMode=yes -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=4 "$nas" 'printf NAS_SSH_OK' 2>&1 || true
