name: Apply final srv-ai edge and NAS

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  apply:
    if: ${{ github.head_ref == 'agent/apply-final-edge-nas' }}
    name: Diagnose NAS export access
    runs-on: [self-hosted, linux, x64, support-production]
    timeout-minutes: 10
    steps:
      - name: Sync approved main and verify HTTPS
        shell: bash
        working-directory: /opt/support-endpoint
        run: |
          set -euo pipefail
          git fetch --prune origin main
          git checkout main
          git reset --hard origin/main
          tls_dir="$HOME/support-endpoint-runtime/tls"
          CSP_TLS_DIR="$tls_dir" docker compose -f compose.edge.yml up -d edge
          curl --cacert "$tls_dir/ca.crt" -fsS --max-time 10 https://srv-ai/health
          echo

      - name: Inspect NAS exports and protocols
        shell: bash
        run: |
          set -euo pipefail
          echo '=== CLIENT ==='
          hostname -I || true
          echo '=== SHOWMOUNT ==='
          docker run --rm --network=host alpine:3.20 sh -ceu '
            apk add --no-cache nfs-utils >/dev/null
            showmount -e 192.168.5.160 || true
            rpcinfo -p 192.168.5.160 || true
          '
          echo '=== FSTAB REFERENCE ==='
          grep -F '192.168.5.160:' /etc/fstab || true
          echo '=== EXISTING MOUNT INFO ==='
          findmnt -T /mnt/ai-lab-nas || true
          findmnt -T /mnt/ai-lab-nas-test || true
