name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm production deployment'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: support-endpoint-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy RC1 on srv-ai
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: [self-hosted, linux, x64, support-production]
    environment: production
    timeout-minutes: 45
    steps:
      - name: Verify target host
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(hostname -s)" == "srv-ai" ]]
          id
          docker --version
          docker compose version
          docker info >/dev/null
          test -d /opt/support-endpoint/.git
          test -f /opt/support-endpoint/.env.production
          [[ "$(stat -c '%a' /opt/support-endpoint/.env.production)" == "600" ]]

      - name: Sync approved main revision
        shell: bash
        working-directory: /opt/support-endpoint
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git fetch --prune origin main
          git checkout main
          git reset --hard origin/main
          printf 'deployment revision=%s\n' "$(git rev-parse HEAD)"

      - name: Deploy and verify
        shell: bash
        working-directory: /opt/support-endpoint
        env:
          CSP_ENV_FILE: .env.production
          RELEASE_VERSION: 0.9.0-rc1
          CSP_SMOKE_BASE_URL: http://127.0.0.1:8180
        run: bash tools/deploy-production.sh
