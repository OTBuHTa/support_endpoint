name: Production NAS Backup

on:
  schedule:
    - cron: '45 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: support-endpoint-nas-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup production PostgreSQL to NAS
    runs-on: [self-hosted, linux, x64, support-production]
    timeout-minutes: 30
    steps:
      - name: Verify target and backup to NAS
        shell: bash
        working-directory: /opt/support-endpoint
        env:
          CSP_ENV_FILE: .env.production
          CSP_NAS_BACKUP_DIR: /mnt/ai-lab-nas/support-endpoint
          CSP_NAS_RETENTION_DAYS: '30'
        run: |
          set -euo pipefail
          [[ "$(hostname -s)" == "srv-ai" ]]
          test -d .git
          test -f .env.production
          [[ "$(stat -c '%a' .env.production)" == "600" ]]
          git fetch --prune origin main
          git checkout main
          git reset --hard origin/main
          bash tools/backup-to-nas.sh
