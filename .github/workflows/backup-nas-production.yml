name: Production NAS Backup

on:
  schedule:
    - cron: '45 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: support-endpoint-nas-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup production PostgreSQL to NAS
    runs-on: [self-hosted, linux, x64, support-production]
    timeout-minutes: 30
    steps:
      - name: Verify target and backup to NAS
        shell: bash
        working-directory: /opt/support-endpoint
        env:
          CSP_ENV_FILE: .env.production
          CSP_NAS_HOST: 192.168.5.160
          CSP_NAS_EXPORT: /Volume1/AI-Lab-Backup
          CSP_NAS_RETENTION_DAYS: '30'
        run: |
          set -euo pipefail
          [[ "$(hostname -s)" == "srv-ai" ]]
          test -d .git
          test -f .env.production
          [[ "$(stat -c '%a' .env.production)" == "600" ]]
          git fetch --prune origin main
          git checkout main
          git reset --hard origin/main

          export CSP_NAS_MOUNT_POINT=/mnt/support-endpoint-nas
          export CSP_NAS_BACKUP_DIR=/mnt/support-endpoint-nas/support-endpoint
          if ! bash tools/ensure-nas-mount.sh; then
            echo 'dedicated NFS mount unavailable; checking existing verified host automount'
            timeout 10 ls /mnt/ai-lab-nas >/dev/null
            findmnt -rn -T /mnt/ai-lab-nas -t nfs,nfs4 >/dev/null
            export CSP_NAS_MOUNT_POINT=/mnt/ai-lab-nas
            export CSP_NAS_BACKUP_DIR=/mnt/ai-lab-nas/support-endpoint
          fi

          bash tools/backup-to-nas.sh
