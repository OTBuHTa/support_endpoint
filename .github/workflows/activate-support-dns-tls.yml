name: Activate support DNS and TLS

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  SUPPORT_HOST: support.netsys-ai.ru
  SUPPORT_IP: 192.168.5.155

jobs:
  activate:
    if: ${{ github.head_ref == 'agent/activate-support-dns-tls' }}
    name: Activate support.netsys-ai.ru
    runs-on: [self-hosted, linux, x64, support-production]
    environment: production
    timeout-minutes: 20
    steps:
      - name: Activate DNS and TLS
        shell: bash
        working-directory: /opt/support-endpoint
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CSP_ENV_FILE: .env.production
          CSP_TLS_DIR: ./runtime/tls
          CSP_TLS_HOSTNAME: support.netsys-ai.ru
          CSP_TLS_IP: 192.168.5.155
          RELEASE_VERSION: 0.9.0
        run: |
          set -euo pipefail
          [[ "$(hostname -s)" == "srv-ai" ]]
          test -f .env.production
          [[ "$(stat -c '%a' .env.production)" == "600" ]]
          git diff --quiet
          git diff --cached --quiet
          git fetch --prune origin main
          git checkout main
          git reset --hard origin/main

          if grep -q '^CORS_ALLOW_ORIGINS=' .env.production; then
            sed -i 's#^CORS_ALLOW_ORIGINS=.*#CORS_ALLOW_ORIGINS=https://support.netsys-ai.ru#' .env.production
          else
            printf '\nCORS_ALLOW_ORIGINS=https://support.netsys-ai.ru\n' >> .env.production
          fi
          chmod 600 .env.production

          bash tools/generate-local-tls.sh
          docker compose -f compose.edge.yml up -d --remove-orphans

          curl --resolve support.netsys-ai.ru:443:127.0.0.1 \
            --cacert ./runtime/tls/ca.crt -fsS https://support.netsys-ai.ru/health
          echo
          openssl x509 -in ./runtime/tls/server.crt -noout -subject -ext subjectAltName

          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ['CLOUDFLARE_API_TOKEN']
          zone = 'netsys-ai.ru'
          name = 'support.netsys-ai.ru'
          ip = '192.168.5.155'
          headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}
          def request(url, method='GET', data=None):
              req = urllib.request.Request(url, method=method, headers=headers,
                  data=None if data is None else json.dumps(data).encode())
              with urllib.request.urlopen(req, timeout=15) as r:
                  return json.load(r)
          z = request('https://api.cloudflare.com/client/v4/zones?name=' + zone)
          if not z.get('success') or not z.get('result'):
              raise SystemExit('cloudflare zone lookup failed')
          zid = z['result'][0]['id']
          records = request(f'https://api.cloudflare.com/client/v4/zones/{zid}/dns_records?type=A&name={name}')
          payload = {'type':'A','name':name,'content':ip,'ttl':300,'proxied':False}
          if records.get('result'):
              rid = records['result'][0]['id']
              out = request(f'https://api.cloudflare.com/client/v4/zones/{zid}/dns_records/{rid}', 'PUT', payload)
          else:
              out = request(f'https://api.cloudflare.com/client/v4/zones/{zid}/dns_records', 'POST', payload)
          if not out.get('success'):
              raise SystemExit('cloudflare DNS update failed')
          print('cloudflare_dns=updated')
          PY
          else
            echo 'cloudflare_dns=token_unavailable'
          fi

          if command -v dig >/dev/null 2>&1; then
            for i in $(seq 1 12); do
              answer="$(dig +short @1.1.1.1 A support.netsys-ai.ru | head -1 || true)"
              [[ "$answer" == "192.168.5.155" ]] && break
              sleep 5
            done
            echo "dns_answer=${answer:-none}"
          fi

          echo 'tls_edge=ready'
