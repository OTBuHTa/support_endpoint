name: One-time runner backup ignore

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  maintain:
    name: Ignore production backups in runner checkout
    if: ${{ github.head_ref == 'agent/fix-production-backup-ignore' }}
    runs-on: [self-hosted, linux, x64, support-production]
    timeout-minutes: 5
    steps:
      - name: Update local Git exclude safely
        shell: bash
        run: |
          set -euo pipefail
          repo=/opt/support-endpoint
          [[ "$(hostname -s)" == "srv-ai" ]]
          test -d "$repo/.git"
          git -C "$repo" remote get-url origin | grep -Eq 'github\.com[:/]OTBuHTa/support_endpoint(\.git)?$'
          exclude="$repo/.git/info/exclude"
          touch "$exclude"
          grep -Fxq '/backups/' "$exclude" || printf '\n/backups/\n' >> "$exclude"
          test -z "$(git -C "$repo" status --porcelain)"
          echo 'runner checkout clean with backups ignored'
