server {
    listen 80;
    server_name _;

    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8000/api/v1/health;
        proxy_set_header Host $host;
    }

    location = /ready {
        proxy_pass http://api:8000/api/v1/ready;
        proxy_set_header Host $host;
    }

    # Never let the SPA fallback make disabled API documentation appear available.
    location = /docs {
        return 404;
    }

    location = /openapi.json {
        return 404;
    }

    location = /redoc {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
